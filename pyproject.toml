[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "injectguard"
version = "1.0.0"
description = "Offline prompt injection scanner. Zero dependencies. No API keys."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kris Kimmerle"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["prompt-injection", "llm", "security", "ai", "scanner", "guardrails"]

[project.urls]
Homepage = "https://github.com/kriskimmerle/injectguard"
Repository = "https://github.com/kriskimmerle/injectguard"
Issues = "https://github.com/kriskimmerle/injectguard/issues"

[project.scripts]
injectguard = "injectguard:main"
